<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACE-RAG | 智能监管知识问答</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333;height:100vh;display:flex;overflow:hidden}

/* ===== 侧边栏 ===== */
.sidebar{width:240px;background:linear-gradient(180deg,#1a1a2e,#16213e);color:#fff;display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:18px;text-align:center;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-header .logo{font-size:26px;margin-bottom:2px}
.sidebar-header h1{font-size:17px;font-weight:600}
.sidebar-header p{font-size:11px;color:#aaa;margin-top:3px}
.sidebar-status{padding:10px 18px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:6px;font-size:12px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80}
.status-dot.offline{background:#f87171;box-shadow:0 0 6px #f87171}
.sidebar-section{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.btn-new-chat{width:100%;padding:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:6px;cursor:pointer;font-size:13px;transition:background .2s}
.btn-new-chat:hover{background:rgba(255,255,255,.2)}
.session-list{flex:1;overflow-y:auto}
.session-item{padding:8px 18px;font-size:12px;cursor:pointer;transition:background .2s}
.session-item:hover{background:rgba(255,255,255,.05)}
.session-item.active{background:rgba(255,255,255,.1)}
.sidebar-stats{padding:12px 18px;border-top:1px solid rgba(255,255,255,.1)}
.stat-item{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.stat-item .label{color:#888}
.stat-item .value{color:#4ade80;font-weight:600}

/* ===== 主区域 ===== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.main-header{padding:12px 20px;background:#fff;border-bottom:1px solid #e8e8e8;flex-shrink:0}
.main-header h2{font-size:16px;font-weight:600;color:#1a1a2e}
.main-header p{font-size:12px;color:#888;margin-top:2px}
.chat-area{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.message{max-width:85%;padding:12px 16px;border-radius:10px;font-size:14px;line-height:1.7;word-wrap:break-word}
.message.user{align-self:flex-end;background:#1677ff;color:#fff}
.message.assistant{align-self:flex-start;background:#fff;border:1px solid #e8e8e8;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.message.assistant .sources{margin-top:10px;padding-top:8px;border-top:1px solid #eee}
.message.assistant .sources h4{font-size:12px;color:#888;margin-bottom:4px}
.message.assistant .source-item{font-size:12px;color:#1677ff;margin-bottom:3px;cursor:pointer;line-height:1.5}
.message.assistant .source-item:hover{text-decoration:underline}
.message.system{align-self:center;background:#fff7e6;border:1px solid #ffd591;color:#d46b08;font-size:13px}
.examples{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:600px;margin:auto}
.example-card{background:#fff;border:1px solid #e8e8e8;border-radius:8px;padding:12px;cursor:pointer;transition:all .2s}
.example-card:hover{border-color:#1677ff;box-shadow:0 2px 8px rgba(22,119,255,.15)}
.example-card .tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:3px;background:#e6f4ff;color:#1677ff;margin-bottom:6px}
.example-card .text{font-size:13px;color:#333;line-height:1.4}

/* ===== 输入区 ===== */
.input-area{padding:12px 20px;background:#fff;border-top:1px solid #e8e8e8;flex-shrink:0}
.input-wrapper{display:flex;gap:10px;align-items:flex-end}
.input-wrapper textarea{flex:1;padding:10px 14px;border:1px solid #d9d9d9;border-radius:6px;font-size:14px;resize:none;height:44px;max-height:100px;line-height:1.5;font-family:inherit;transition:border-color .2s}
.input-wrapper textarea:focus{outline:none;border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.btn-send{padding:10px 20px;background:#1677ff;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:500;transition:background .2s;white-space:nowrap}
.btn-send:hover{background:#0958d9}
.btn-send:disabled{background:#d9d9d9;cursor:not-allowed}

/* ===== 追踪面板 ===== */
.trace-panel{width:420px;background:#1e1e2e;color:#d4d4d4;display:flex;flex-direction:column;flex-shrink:0;font-family:'Fira Code','Consolas',monospace;font-size:12px}
.trace-tabs{display:flex;border-bottom:1px solid #333;flex-shrink:0}
.trace-tab{padding:8px 12px;cursor:pointer;color:#888;border-bottom:2px solid transparent;transition:all .2s;font-size:12px}
.trace-tab.active{color:#4ade80;border-bottom-color:#4ade80}
.trace-tab:hover{color:#ccc}
.trace-content{flex:1;overflow-y:auto;padding:10px}
.trace-section{margin-bottom:12px;border:1px solid #333;border-radius:4px;overflow:hidden}
.trace-section-header{padding:6px 10px;background:#2a2a3e;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:600;font-size:12px}
.trace-section-header:hover{background:#333}
.trace-section-body{padding:8px 10px;display:none}
.trace-section-body.open{display:block}
.trace-section-arrow{transition:transform .2s}
.trace-section-arrow.open{transform:rotate(90deg)}

/* 流程步骤 */
.trace-step{padding:4px 0;display:flex;align-items:center;gap:6px}
.trace-step-num{width:20px;height:20px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-size:10px;color:#aaa;flex-shrink:0}
.trace-step-name{color:#61afef;font-weight:600}
.trace-step-line{width:2px;height:8px;background:#333;margin-left:9px}

/* 指标卡片 */
.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.metric-card{padding:6px 8px;background:#2a2a3e;border-radius:4px}
.metric-card .metric-label{font-size:10px;color:#888}
.metric-card .metric-value{font-size:13px;font-weight:600}
.metric-card .metric-value.good{color:#4ade80}
.metric-card .metric-value.warn{color:#e5c07b}
.metric-card .metric-value.fail{color:#f87171}

/* 引用项 */
.citation-item{padding:4px 8px;background:#2a2a3e;border-radius:3px;margin-bottom:3px;font-size:11px}
.citation-item .cit-index{color:#e5c07b;font-weight:700}
.citation-item .cit-doc{color:#61afef}
.citation-item .cit-chunk{color:#888;font-size:10px}

/* 原始JSON */
.raw-json{white-space:pre-wrap;word-break:break-all;font-size:10px;line-height:1.5;color:#98c379;max-height:400px;overflow-y:auto;background:#0d0d1a;padding:8px;border-radius:4px}
.btn-copy{padding:4px 10px;background:#333;border:1px solid #555;color:#ccc;border-radius:4px;cursor:pointer;font-size:11px;margin-bottom:6px}
.btn-copy:hover{background:#444}
.empty-hint{text-align:center;padding:30px 16px;color:#555;font-size:12px}

/* 加载动画 */
.loading-dots{display:inline-flex;gap:4px;align-items:center}
.loading-dots span{width:6px;height:6px;border-radius:50%;background:#1677ff;animation:bounce 1.4s infinite ease-in-out}
.loading-dots span:nth-child(2){animation-delay:.16s}
.loading-dots span:nth-child(3){animation-delay:.32s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
.chat-area::-webkit-scrollbar-thumb{background:#d9d9d9}
</style>
</head>
<body>

<!-- ===== 侧边栏 ===== -->
<div class="sidebar">
  <div class="sidebar-header">
    <div class="logo">🦞</div>
    <h1>ACE-RAG</h1>
    <p>智能监管知识问答</p>
  </div>
  <div class="sidebar-status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">检测中...</span>
  </div>
  <div class="sidebar-section">
    <button class="btn-new-chat" onclick="newChat()">+ 新对话</button>
  </div>
  <div class="session-list" id="sessionList"></div>
  <div class="sidebar-stats">
    <div class="stat-item"><span class="label">知识库文档</span><span class="value" id="docCount">-</span></div>
    <div class="stat-item"><span class="label">文本分块</span><span class="value" id="chunkCount">-</span></div>
  </div>
</div>

<!-- ===== 主区域 ===== -->
<div class="main">
  <div class="main-header">
    <h2>🦞 ACE-RAG 智能监管知识问答</h2>
    <p>自适应编译式证据检索 · 覆盖保险、银行等金融监管领域</p>
  </div>
  <div class="chat-area" id="chatArea">
    <div class="examples" id="examples">
      <div class="example-card" onclick="askExample(0)">
        <span class="tag">监管要求</span>
        <div class="text">保险公司核心一级资本充足率不得低于多少？</div>
      </div>
      <div class="example-card" onclick="askExample(1)">
        <span class="tag">法规验证</span>
        <div class="text">寿险合同负债评估中折现率曲线由基础利率曲线加综合溢价形成。准确吗</div>
      </div>
      <div class="example-card" onclick="askExample(2)">
        <span class="tag">数据查询</span>
        <div class="text">保险期限一年及以下的个人意外险平均附加费用率上限是多少？</div>
      </div>
      <div class="example-card" onclick="askExample(3)">
        <span class="tag">法规查询</span>
        <div class="text">商业银行资本管理办法对资本充足率有哪些要求？</div>
      </div>
    </div>
  </div>
  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="inputBox" placeholder="输入您的问题..." onkeydown="handleKey(event)"></textarea>
      <button class="btn-send" id="sendBtn" onclick="sendQuery()">发送 →</button>
    </div>
  </div>
</div>

<!-- ===== 追踪面板 ===== -->
<div class="trace-panel">
  <div class="trace-tabs">
    <div class="trace-tab active" onclick="switchTraceTab('trace',this)">🔍 追踪</div>
    <div class="trace-tab" onclick="switchTraceTab('raw',this)">📄 原始JSON</div>
    <div class="trace-tab" onclick="switchTraceTab('claims',this)">⚖ 声明证据</div>
  </div>
  <div class="trace-content" id="traceContent">
    <div class="empty-hint">📋<br>发送问题后<br>这里将显示完整的 API 调用追溯</div>
  </div>
</div>

<script>
let currentSession=null,isLoading=false,lastResponse=null;
const EXAMPLES=[
  '保险公司核心一级资本充足率不得低于多少？',
  '寿险合同负债评估中计算现金流现值所采用的折现率曲线由基础利率曲线加综合溢价形成。准确吗',
  '保险期限一年及以下的个人意外险平均附加费用率上限是多少？',
  '商业银行资本管理办法对资本充足率有哪些要求？'
];

// ===== API 调用 =====
async function api(path,opts){
  const r=await fetch(path,opts);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

// ===== 健康检查 =====
async function checkHealth(){
  try{
    const[agent,ret]=await Promise.all([
      api('/api/agent/health').catch(()=>null),
      api('/api/retrieval/health').catch(()=>null)
    ]);
    const ok=agent&&agent.status==='ok'&&ret&&ret.status==='ok';
    document.getElementById('statusDot').className='status-dot'+(ok?'':' offline');
    document.getElementById('statusText').textContent=ok?'服务正常':'服务异常';
    if(ret){
      document.getElementById('docCount').textContent=(ret.docs||ret.doc_count||0)+' 篇';
      document.getElementById('chunkCount').textContent=(ret.chunks||ret.chunk_count||0)+' 块';
    }
  }catch(e){
    document.getElementById('statusDot').className='status-dot offline';
    document.getElementById('statusText').textContent='连接失败';
  }
}

// ===== 新对话 =====
function newChat(){
  currentSession=null;
  document.getElementById('chatArea').innerHTML='<div class="examples" id="examples">'+document.querySelectorAll('.example-card').length+'个示例</div>';
  rebuildExamples();
  document.getElementById('traceContent').innerHTML='<div class="empty-hint">📋<br>发送问题后<br>这里将显示完整的 API 调用追溯</div>';
}

function rebuildExamples(){
  const area=document.getElementById('chatArea');
  area.innerHTML='<div class="examples" id="examples">'+
    EXAMPLES.map((q,i)=>'<div class="example-card" onclick="askExample('+i+')">'+
    '<span class="tag">'+['监管要求','法规验证','数据查询','法规查询'][i]+'</span>'+
    '<div class="text">'+escapeHtml(q.substring(0,40))+'</div></div>').join('')+'</div>';
}

function askExample(i){
  document.getElementById('inputBox').value=EXAMPLES[i]||'';
  sendQuery();
}

function handleKey(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendQuery();}
}

// ===== 消息 =====
function addMsg(role,html){
  const area=document.getElementById('chatArea');
  const ex=document.getElementById('examples');
  if(ex) ex.remove();
  const div=document.createElement('div');
  div.className='message '+role;
  div.innerHTML=html;
  area.appendChild(div);
  area.scrollTop=area.scrollHeight;
  return div;
}

function escapeHtml(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== 发送查询 =====
async function sendQuery(){
  const q=document.getElementById('inputBox').value.trim();
  if(!q||isLoading) return;
  isLoading=true;
  document.getElementById('sendBtn').disabled=true;
  document.getElementById('inputBox').value='';
  addMsg('user',escapeHtml(q));
  const loadingDiv=addMsg('assistant','<div class="loading-dots"><span></span><span></span><span></span></div>');

  try{
    const body={query:q};
    if(currentSession) body.session_id=currentSession;
    const t0=Date.now();
    const r=await api('/api/agent/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const elapsed=((Date.now()-t0)/1000).toFixed(1);
    lastResponse=r;
    loadingDiv.remove();
    if(r.session_id) currentSession=r.session_id;

    // 构建回答HTML
    let html='<p>'+escapeHtml(r.answer||'无回答')+'</p>';

    // 来源引用（修复：正确解析 citations 字段）
    if(r.citations&&r.citations.length>0){
      html+='<div class="sources"><h4>📚 来源引用 ('+r.citations.length+'条)</h4>';
      r.citations.forEach((c,i)=>{
        const cit=c.citation||'';
        const doc=c.source_doc||'';
        const chunk=c.chunk_id||'';
        // 文档名提取（取文件名的简短形式）
        let shortDoc=doc;
        if(doc.length>60) shortDoc=doc.substring(0,55)+'...';
        html+='<div class="source-item">['+(i+1)+'] '+escapeHtml(cit);
        if(chunk) html+=' <span style="color:#999;font-size:11px">chunk='+escapeHtml(chunk)+'</span>';
        html+='</div>';
      });
      html+='</div>';
    }

    // 关键指标摘要
    const lat=r.latency_ms?(r.latency_ms/1000).toFixed(1)+'s':'-';
    html+='<div style="margin-top:8px;font-size:12px;color:#999">';
    html+='耗时:'+lat+' | 证据:'+(r.evidence_count||0)+'条 | 充分性:'+((r.sufficiency_score||0)).toFixed(2);
    html+=' | 置信度:'+((r.confidence||0)).toFixed(2);
    if(r.is_refusal) html+=' | <span style="color:#f87171;font-weight:600">拒答</span>';
    html+='</div>';

    addMsg('assistant',html);

    // 更新追踪面板
    renderTrace(r,elapsed,q);

  }catch(e){
    loadingDiv.remove();
    addMsg('system','⚠️ 请求失败: '+e.message);
    document.getElementById('traceContent').innerHTML='<div class="empty-hint" style="color:#f87171">❌ 错误: '+escapeHtml(e.message)+'</div>';
  }finally{
    isLoading=false;
    document.getElementById('sendBtn').disabled=false;
  }
}

// ===== 追踪面板渲染 =====
function renderTrace(r,elapsed,query){
  const container=document.getElementById('traceContent');

  // === 1. 查询信息 ===
  let html=section('query','📝 查询信息',`
    <div style="margin-bottom:4px"><span style="color:#888">问题:</span> <span style="color:#e5c07b">${escapeHtml(query.substring(0,80))}${query.length>80?'...':''}</span></div>
    <div style="margin-bottom:2px"><span style="color:#888">request_id:</span> <span style="color:#98c379;font-size:10px">${escapeHtml(r.request_id||'-')}</span></div>
    <div><span style="color:#888">session_id:</span> <span style="color:#98c379;font-size:10px">${escapeHtml(r.session_id||'-')}</span></div>
  `);

  // === 2. 流程轨迹 ===
  const trace=r.state_trace||[];
  let traceHtml='';
  trace.forEach((s,i)=>{
    const isLast=i===trace.length-1;
    traceHtml+=`<div class="trace-step">
      <div class="trace-step-num">${i+1}</div>
      <span class="trace-step-name">${escapeHtml(String(s))}</span>
      <span style="color:#4ade80;margin-left:auto;font-size:10px">✓</span>
    </div>`;
    if(!isLast) traceHtml+='<div class="trace-step-line"></div>';
  });
  if(trace.length===0) traceHtml='<div style="color:#666;padding:4px">无流程数据</div>';
  html+=section('trace','🔧 流程轨迹 ('+trace.length+'步)',traceHtml);

  // === 3. 关键指标 ===
  const intent=r.intent||'-';
  const complexity=r.complexity||'-';
  const evCount=r.evidence_count||0;
  const suff=(r.sufficiency_score||0).toFixed(2);
  const conf=(r.confidence||0).toFixed(2);
  const lat=r.latency_ms?(r.latency_ms/1000).toFixed(2)+'s':'-';
  const refusal=r.is_refusal;
  const refusalReason=r.refusal_reason||'';

  const suffColor=suff>=0.6?'good':(suff>=0.3?'warn':'fail');
  const confColor=conf>=0.8?'good':(conf>=0.5?'warn':'fail');

  html+=section('metrics','📊 关键指标',`
    <div class="metrics-grid">
      <div class="metric-card"><div class="metric-label">意图</div><div class="metric-value">${escapeHtml(intent)}</div></div>
      <div class="metric-card"><div class="metric-label">复杂度</div><div class="metric-value">${escapeHtml(complexity)}</div></div>
      <div class="metric-card"><div class="metric-label">证据数</div><div class="metric-value ${evCount>0?'good':'fail'}">${evCount}</div></div>
      <div class="metric-card"><div class="metric-label">充分性</div><div class="metric-value ${suffColor}">${suff}</div></div>
      <div class="metric-card"><div class="metric-label">置信度</div><div class="metric-value ${confColor}">${conf}</div></div>
      <div class="metric-card"><div class="metric-label">延迟</div><div class="metric-value">${lat}</div></div>
      <div class="metric-card"><div class="metric-label">拒答</div><div class="metric-value ${refusal?'fail':'good'}">${refusal?'是':'否'}</div></div>
      <div class="metric-card"><div class="metric-label">总耗时</div><div class="metric-value">${elapsed}s</div></div>
    </div>
    ${refusalReason?'<div style="margin-top:6px;padding:4px 6px;background:#3a1a1a;border-radius:3px;color:#f87171;font-size:11px">拒答原因: '+escapeHtml(refusalReason)+'</div>':''}
  `);

  // === 4. 来源引用 ===
  const cites=r.citations||[];
  let citHtml='';
  if(cites.length===0){
    citHtml='<div style="color:#666;padding:4px">无来源引用</div>';
  }else{
    cites.forEach((c,i)=>{
      citHtml+=`<div class="citation-item">
        <span class="cit-index">[${i+1}]</span>
        <span class="cit-doc">${escapeHtml(c.citation||'-')}</span><br>
        <span class="cit-chunk">doc: ${escapeHtml((c.source_doc||'-').substring(0,60))}${(c.source_doc||'').length>60?'...':''}</span><br>
        <span class="cit-chunk">chunk_id: ${escapeHtml(c.chunk_id||'-')}</span>
      </div>`;
    });
  }
  html+=section('citations','📚 来源引用 ('+cites.length+'条)',citHtml);

  // === 5. 歧义信息 ===
  const ambs=r.ambiguities||[];
  if(ambs.length>0){
    let ambHtml='';
    ambs.forEach(a=>{
      ambHtml+='<div style="padding:4px 6px;background:#2a2a3e;border-radius:3px;margin-bottom:3px;font-size:11px">';
      if(typeof a==='string'){
        ambHtml+=escapeHtml(a);
      }else{
        ambHtml+=escapeHtml(JSON.stringify(a));
      }
      ambHtml+='</div>';
    });
    html+=section('ambiguities','⚠️ 歧义信息 ('+ambs.length+'条)',ambHtml);
  }

  // === 6. 原始JSON（折叠在底部） ===
  const jsonStr=JSON.stringify(r,null,2);
  const jsonEscaped=escapeHtml(jsonStr);
  html+=`<div class="trace-section">
    <div class="trace-section-header" onclick="toggleSection(this)">
      <span class="trace-section-arrow">▶</span>
      📄 完整 API 响应 JSON (${(jsonStr.length/1024).toFixed(1)}KB)
    </div>
    <div class="trace-section-body">
      <button class="btn-copy" onclick="copyJson()">📋 复制JSON</button>
      <div class="raw-json" id="rawJson">${jsonEscaped}</div>
    </div>
  </div>`;

  container.innerHTML=html;
}

// ===== 折叠区域 =====
function section(id,title,body){
  return `<div class="trace-section">
    <div class="trace-section-header" onclick="toggleSection(this)">
      <span class="trace-section-arrow open">▶</span>
      ${title}
    </div>
    <div class="trace-section-body open">${body}</div>
  </div>`;
}

function toggleSection(header){
  const body=header.nextElementSibling;
  const arrow=header.querySelector('.trace-section-arrow');
  if(body.classList.contains('open')){
    body.classList.remove('open');
    arrow.classList.remove('open');
  }else{
    body.classList.add('open');
    arrow.classList.add('open');
  }
}

// ===== 切换Tab =====
function switchTraceTab(tab,el){
  document.querySelectorAll('.trace-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const container=document.getElementById('traceContent');

  if(tab==='raw'&&lastResponse){
    const jsonStr=JSON.stringify(lastResponse,null,2);
    container.innerHTML=`<button class="btn-copy" onclick="copyJson()">📋 复制JSON</button><div class="raw-json">${escapeHtml(jsonStr)}</div>`;
  }else if(tab==='claims'&&lastResponse){
    const claims=lastResponse.claims_with_evidence||[];
    if(claims.length===0){
      container.innerHTML='<div class="empty-hint">无声明-证据映射数据</div>';
    }else{
      let html='';
      claims.forEach((c,i)=>{
        html+='<div class="trace-section"><div class="trace-section-header" onclick="toggleSection(this)"><span class="trace-section-arrow open">▶</span>声明 '+(i+1)+'</div><div class="trace-section-body open">';
        html+='<pre style="white-space:pre-wrap;font-size:11px;line-height:1.5">'+escapeHtml(JSON.stringify(c,null,2))+'</pre>';
        html+='</div></div>';
      });
      container.innerHTML=html;
    }
  }else if(tab==='trace'&&lastResponse){
    // 重新渲染完整追踪
    renderTrace(lastResponse,'-','');
  }
}

// ===== 复制JSON =====
function copyJson(){
  if(!lastResponse) return;
  const jsonStr=JSON.stringify(lastResponse,null,2);
  navigator.clipboard.writeText(jsonStr).then(()=>{
    // 临时提示
    const btn=event.target;
    const orig=btn.textContent;
    btn.textContent='✅ 已复制';
    setTimeout(()=>{btn.textContent=orig;},1500);
  }).catch(()=>{
    // fallback
    const ta=document.createElement('textarea');
    ta.value=jsonStr;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
}

// ===== 初始化 =====
checkHealth();
setInterval(checkHealth,30000);
