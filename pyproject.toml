[project]
name = "ace-rag"
version = "0.1.0"
description = "Adaptive Compiled Evidence RAG for regulatory knowledge base QA"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web 框架
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    # Redis
    "redis[hiredis]>=5.0.0",
    # 数据库
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    # 检索
    "elasticsearch>=8.13.0",
    "pymilvus>=2.4.0",
    # LLM
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "tiktoken>=0.7.0",
    # 异步与任务
    "aiohttp>=3.9.0",
    "celery>=5.4.0",
    # 可观测性
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",
    # 工具
    "pyyaml>=6.0",
    "jsonschema>=4.22.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["agent_platform/tests", "knowledge_platform/tests"]

[tool.mypy]
python_version = "3.11"
strict = true
