# ACE-RAG Nginx 配置 (Docker 版)
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log notice;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    upstream ace_rag_retrieval {
        server retrieval:8000;
    }

    upstream ace_rag_agent {
        server agent:8002;
    }

    server {
        listen 80 default_server;
        server_name _;

        # 前端静态文件
        location / {
            root /var/www/ace-rag;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 检索服务健康检查
        location = /api/retrieval/health {
            proxy_pass http://ace_rag_retrieval/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Agent 服务健康检查
        location = /api/agent/health {
            proxy_pass http://ace_rag_agent/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 检索服务 API
        location /api/retrieval/ {
            proxy_pass http://ace_rag_retrieval/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        # 文件服务（真实业务文件预览/下载）
        location /api/files/ {
            proxy_pass http://ace_rag_agent/api/files/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        # Agent 服务 API
        location /api/agent/ {
            proxy_pass http://ace_rag_agent/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_cache off;
            # SSE 流式必需: HTTP/1.1 + 长连接
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header X-Accel-Buffering no;
        }

        # 直接健康检查
        location = /health {
            proxy_pass http://ace_rag_retrieval/health;
            proxy_set_header Host $host;
        }
    }
}
