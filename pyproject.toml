[project]
name = "ace-rag"
version = "0.1.0"
description = "Adaptive Compiled Evidence RAG for regulatory knowledge base QA"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web 框架
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    # 检索 — 向量化与语义检索
    "sentence-transformers>=2.7.0",
    "numpy>=1.26.0",
    "modelscope>=1.10.0",
    # 配置
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# LLM 调用（未安装 openai 时自动回退 httpx 直连，两者均无时降级 Mock）
llm = [
    "openai>=1.30.0",
    "httpx>=0.27.0",
]
# 会话持久化 / 计划缓存（未安装时自动降级为内存字典）
redis = [
    "redis[hiredis]>=5.0.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "jsonschema>=4.22.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["agent_platform/tests", "knowledge_platform/tests"]

[tool.mypy]
python_version = "3.11"
strict = true
